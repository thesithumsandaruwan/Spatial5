name: Release

# Push a tag like v1.2 (or publish a release for one) and the signed APK is attached to it.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets first (see README, 'Releases')."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-spatial5}"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > signing/keystore.properties

      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME}"
          ./gradlew testDebugUnitTest assembleRelease \
            -PappVersionName="${TAG#v}" -PappVersionCode="$(git rev-list --count HEAD)"
          cp app/build/outputs/apk/release/app-release.apk "Spatial5-${TAG}.apk"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Spatial5-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "Spatial5-${TAG}.apk" --title "Spatial5 ${TAG}" --generate-notes
          fi

      - name: Remove signing files
        if: always()
        run: rm -rf signing
