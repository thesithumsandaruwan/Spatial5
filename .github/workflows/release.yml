name: Release

# Three ways to publish a release with the signed APK attached:
#  - Actions > Release > Run workflow, enter a version (creates the tag and the release),
#  - push a tag like v1.2,
#  - publish a release for a new tag on GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2 (tag v1.2 is created)'
        required: true
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets first (see README, 'Releases')."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-spatial5}"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > signing/keystore.properties

      - name: Work out the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then echo "TAG=v${INPUT_VERSION#v}" >> "$GITHUB_ENV"; else echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; fi

      - name: Build
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -PappVersionName="${TAG#v}" -PappVersionCode="$(git rev-list --count HEAD)"
          cp app/build/outputs/apk/release/app-release.apk "Spatial5-${TAG}.apk"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Spatial5-${TAG}.apk" --clobber
          else
            # Creates the tag on this commit if it doesn't exist yet.
            gh release create "$TAG" "Spatial5-${TAG}.apk" --target "$GITHUB_SHA" \
              --title "Spatial5 ${TAG}" --notes-file .github/release-notes.md
          fi

      - name: Remove signing files
        if: always()
        run: rm -rf signing
